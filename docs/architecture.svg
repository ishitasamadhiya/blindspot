<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="15">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8794"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#cfd4da;stroke-width:1.5;rx:10}
      .accent{stroke:#0f6cbd;stroke-width:2}
      .success{stroke:#0e7a0d;stroke-width:2}
      .danger{stroke:#c50f1f;stroke-width:2}
      .t{fill:#1b1f24;font-weight:600;font-size:17px}
      .s{fill:#5b6470;font-size:13.5px}
      .lane{fill:#f3f4f6;stroke:#e3e6ea}
      .lanet{fill:#8a93a0;font-size:12px;letter-spacing:.08em;font-weight:600}
      .edge{stroke:#7a8794;stroke-width:2;fill:none;marker-end:url(#a)}
      .note{fill:#5b6470;font-size:12.5px;font-style:italic}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#fafbfc"/>
  <rect x="20" y="20" width="1360" height="130" class="lane" rx="12"/>
  <text x="36" y="42" class="lanet">INPUTS</text>
  <rect x="20" y="170" width="1360" height="200" class="lane" rx="12"/>
  <text x="36" y="192" class="lanet">COVERAGE JOB · checkpointed steps, resumes after a crash</text>
  <rect x="20" y="390" width="1360" height="210" class="lane" rx="12"/>
  <text x="36" y="412" class="lanet">PEOPLE · VERSIONS · GATE</text>

  <rect x="40" y="60" width="300" height="72" class="box" rx="10"/>
  <text x="56" y="88" class="t">Agent traces</text>
  <text x="56" y="110" class="s">POST /api/traces · claim, output, signals · BYO</text>
  <rect x="380" y="60" width="300" height="72" class="box accent" rx="10"/>
  <text x="396" y="88" class="t">Golden set vN</text>
  <text x="396" y="110" class="s">immutable · content-addressed · expert-graded</text>
  <rect x="720" y="60" width="300" height="72" class="box" rx="10"/>
  <text x="736" y="88" class="t">Agent release candidate</text>
  <text x="736" y="110" class="s">rule-based validator · 1.3 / 1.4 / 1.5</text>
  <rect x="1060" y="60" width="300" height="72" class="box" rx="10"/>
  <text x="1076" y="88" class="t">Embedder · Judge</text>
  <text x="1076" y="110" class="s">hashing + simulated offline · Azure OpenAI optional</text>

  <g>
    <rect x="40" y="220" width="200" height="110" class="box" rx="10"/>
    <text x="56" y="248" class="t">1 · embed</text>
    <text x="56" y="270" class="s">field paths, values,</text>
    <text x="56" y="288" class="s">magnitudes, tokens</text>
    <text x="56" y="316" class="note">cached by content hash</text>
    <rect x="270" y="220" width="200" height="110" class="box" rx="10"/>
    <text x="286" y="248" class="t">2 · calibrate + cover</text>
    <text x="286" y="270" class="s">τ = 5th pct of golden</text>
    <text x="286" y="288" class="s">self-similarity (held-out)</text>
    <text x="286" y="316" class="note">covered ⇔ sim ≥ τ</text>
    <rect x="500" y="220" width="200" height="110" class="box danger" rx="10"/>
    <text x="516" y="248" class="t">3 · cluster + name</text>
    <text x="516" y="270" class="s">k-means++ / silhouette on</text>
    <text x="516" y="288" class="s">uncovered traffic only</text>
    <text x="516" y="316" class="note">named by distinguishing fields</text>
    <rect x="730" y="220" width="200" height="110" class="box" rx="10"/>
    <text x="746" y="248" class="t">4 · judge pre-grade</text>
    <text x="746" y="270" class="s">pass / confidence /</text>
    <text x="746" y="288" class="s">rationale per trace</text>
    <text x="746" y="316" class="note">unvalidated ⇒ unsure</text>
    <rect x="960" y="220" width="200" height="110" class="box" rx="10"/>
    <text x="976" y="248" class="t">5 · select</text>
    <text x="976" y="270" class="s">medoid · 2 neighbours ·</text>
    <text x="976" y="288" class="s">2 random · disagreements</text>
    <text x="976" y="316" class="note">10 per blind spot</text>
    <rect x="1190" y="220" width="170" height="110" class="box" rx="10"/>
    <text x="1206" y="248" class="t">6 · persist</text>
    <text x="1206" y="270" class="s">coverage run,</text>
    <text x="1206" y="288" class="s">ranked blind spots,</text>
    <text x="1206" y="306" class="s">map, SSE event</text>
  </g>
  <path d="M240,275 L268,275" class="edge"/><path d="M470,275 L498,275" class="edge"/><path d="M700,275 L728,275" class="edge"/><path d="M930,275 L958,275" class="edge"/><path d="M1160,275 L1188,275" class="edge"/>
  <path d="M190,132 L140,218" class="edge"/><path d="M530,132 L370,218" class="edge"/><path d="M1210,132 L830,218" class="edge"/>

  <rect x="40" y="440" width="300" height="120" class="box" rx="10"/>
  <text x="56" y="468" class="t">Grading queue</text>
  <text x="56" y="490" class="s">React · keyboard-first · roles</text>
  <text x="56" y="508" class="s">judge ↔ expert agreement, κ per blind spot</text>
  <text x="56" y="540" class="note">experts grade 10, not 1,000</text>
  <rect x="380" y="440" width="300" height="120" class="box success" rx="10"/>
  <text x="396" y="468" class="t">Commit golden vN+1</text>
  <text x="396" y="490" class="s">+harvested cases with cluster provenance</text>
  <text x="396" y="508" class="s">sha256 · diff · Foundry JSONL export</text>
  <text x="396" y="540" class="note">auto-starts coverage vs the new version</text>
  <rect x="720" y="440" width="300" height="120" class="box" rx="10"/>
  <text x="736" y="468" class="t">Eval job</text>
  <text x="736" y="490" class="s">replay in batches of 40 (checkpointed)</text>
  <text x="736" y="508" class="s">accuracy + paired-bootstrap CIs · per blind spot</text>
  <text x="736" y="540" class="note">10,000 resamples, fixed seed</text>
  <rect x="1060" y="440" width="300" height="120" class="box danger" rx="10"/>
  <text x="1076" y="468" class="t">Release gate</text>
  <text x="1076" y="490" class="s">coverage ≥ 85% · blind spots ≥ 80%</text>
  <text x="1076" y="508" class="s">accuracy ≥ 85% · no regression outside CI</text>
  <text x="1076" y="540" class="note">CLI exit code · partial never passes</text>
  <path d="M1275,330 L190,438" class="edge"/>
  <path d="M340,500 L378,500" class="edge"/><path d="M680,500 L718,500" class="edge"/><path d="M1020,500 L1058,500" class="edge"/>
  <path d="M530,440 L530,340 L470,340 L470,132" class="edge" stroke-dasharray="6 5"/>
  <text x="1070" y="592" class="note">Fastify · node:sqlite · server-sent events · vitest · Remotion for the video</text>
</svg>
