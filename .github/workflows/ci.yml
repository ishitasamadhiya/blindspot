name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Release gate (the story ends with release/1.4; exit code is the gate)
        run: npm run story
        env:
          BLINDSPOT_DB: ./data/ci.sqlite
